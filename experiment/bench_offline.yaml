# @package _global_
# Offline ice flow: pretrained dahunet_mini (shipped with IGM), inference only. Otherwise as bench_online.yaml.

core:
  url_data: ""
  logging: False
  print_comp: True

defaults:
  - /user/conf/processes@processes.bench_sync: bench_sync
  - /user/conf/processes@processes.bench_timer: bench_timer
  - override /inputs:
    - local
  - override /processes:
    - smb
    - iceflow
    - bench_sync
    - time
    - thk
    - bench_timer

inputs:
  local:
    filename: ${hydra:runtime.cwd}/data/input_bench.nc
    coarsening:
      ratio: 1

processes:
  time:
    start: 0.0
    end: 100.0
    save: 1.0e6
    cfl: 0.3
    step_max: 1.0

  smb:
    method: simple
    simple:
      array:
        - ['time', 'gradabl', 'gradacc', 'ela', 'accmax']
        - [0,      0.009,     0.005,     2300,  2.0]
        - [1.0e6,  0.009,     0.005,     2300,  2.0]

  iceflow:
    method: unified
    numerics:
      Nz: 2
      basis_horizontal: q1    # as dahunet_mini was trained
      basis_vertical: molho
    physics:
      sliding:
        u_ref: 100.0
        tau_ref: 0.2153697218796329
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      nbit: 0
      nbit_init: 0
      retrain_freq: 0
      network:
        pretrained_path: "dahunet_mini.keras"
        pretrained: true
      data_preparation:
        framesizemax: 99999
